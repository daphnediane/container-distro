name: release

# Pushing an annotated v* tag verifies it against the workspace version,
# re-runs the tests, and drafts the GitHub Release from the CHANGELOG
# section — the maintainer reviews and publishes the draft. No binaries:
# install is source-only (#14 owns packaging).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$version" ]; then
            echo "tag $TAG != Cargo.toml workspace version $version" >&2
            exit 1
          fi

      - run: cargo test --workspace

      - name: Extract CHANGELOG notes
        env:
          TAG: ${{ github.ref_name }}
        # Literal-prefix match on `## X.Y.Z `, stop at the next `## `
        # header — the section header line itself is included.
        # (Portable: BSD `head` has no `-n -1`.)
        run: |
          awk -v hdr="## ${TAG#v} " '
            f && /^## / { exit }
            index($0, hdr) == 1 { f = 1 }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md section for ${TAG#v}" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Title matches the annotated tag's message ("container-distro
        # X.Y.Z"); --draft leaves publishing to the maintainer.
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --notes-file notes.md \
            --title "container-distro ${GITHUB_REF_NAME#v}" \
            $prerelease
