[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "BSD-2-Clause"
authors = ["Daphne Pfister"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
cm-core = { path = "crates/cm-core" }
container-distro = { path = "crates/container-distro" }
