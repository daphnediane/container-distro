[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "BSD-2-Clause"
authors = ["Daphne Pfister"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3"
proptest = "1.11"
# rustls-no-provider + _ring + platform-verifier: rustls backed by the
# OS trust store (Security.framework on macOS) — no bundled webpki roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }
cm-core = { path = "crates/cm-core" }
container-distro = { path = "crates/container-distro" }
