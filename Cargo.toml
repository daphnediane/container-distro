[package]
name = "container-distro"
description = "`container distro` plugin and `cm`: machine-like distros and a WSL-compatible CLI for Apple container"
version = "0.6.0-dev"
edition = "2024"
rust-version = "1.89"
license = "BSD-2-Clause"
authors = ["Daphne Pfister"]
homepage = "https://github.com/daphnediane/container-distro"
repository = "https://github.com/daphnediane/container-distro"
readme = "README.md"
# Published crate stays lean: binaries + assets + notices only.
exclude = [
    "/.claude/",
    "/.devin/",
    "/.github/",
    "/.templates/",
    "/.vscode/",
    "/.markdownlint.json",
    "/docs/",
    "/packaging/",
    "/scripts/",
    "/deny.toml",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.3"
flate2 = "1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
# rustls-no-provider + _ring + platform-verifier: rustls backed by the
# OS trust store (Security.framework on macOS) — no bundled webpki roots.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }

[dev-dependencies]
proptest = "1.11"

# `cargo release` conventions (dry-run by default, `-x` to execute):
# strips the -dev suffix, commits `chore: release X.Y.Z`, and tags
# `vX.Y.Z`. crates.io publish and git push stay manual (docs/design/release.md).
[package.metadata.release]
allow-branch = ["main", "release/*"]
consolidate-commits = false
pre-release-commit-message = "chore: release {{version}}"
tag-name = "v{{version}}"
tag-message = "container-distro {{version}}"
publish = false
push = false

# Prebuilt binaries land on each GitHub Release (scripts/build-pkg.sh,
# driven by .github/workflows/release.yml) — `cargo binstall
# container-distro` fetches the matching tarball instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
