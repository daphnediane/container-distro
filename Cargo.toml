[package]
name = "wsl-compat"
version = "0.1.0"
edition = "2024"
description = "WSL-compatible CLI wrapper for Apple container machines"
license = "BSD-2-Clause"

[[bin]]
name = "cm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
